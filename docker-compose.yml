services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_teacher_portal_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/teacher_portal
      - JWT_SECRET=super_secret_jwt_teacher_portal_key_2026_dev_secure
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=*
      - TIMEZONE=Asia/Kolkata
      - STORAGE_PROVIDER=local
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - uploads_data:/app/backend/uploads
    networks:
      - portal_network

  mongodb:
    image: mongo:7.0
    container_name: ai_teacher_portal_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - portal_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
    driver: local
  uploads_data:
    driver: local

networks:
  portal_network:
    driver: bridge
