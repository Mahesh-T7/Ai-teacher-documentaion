services:
  # Unified Monorepo Web Service (Serves both API and Frontend SPA)
  - type: web
    name: ai-teacher-documentation-portal
    env: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: '*'
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: STORAGE_PROVIDER
        value: local
